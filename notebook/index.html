<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="description" content="採点済みのテストを写真で取りこみ、まちがえた問題を教科・単元ごとにためて、忘却曲線にそって解き直すノート">
  <title>解き直しノート</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="home-btn" type="button" data-go="home">📒 解き直しノート</button>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <nav class="tabbar" aria-label="メニュー">
    <button type="button" data-go="home"><span>🏠</span>ホーム</button>
    <button type="button" data-go="import"><span>📷</span>取りこみ</button>
    <button type="button" data-go="list"><span>📒</span>ノート</button>
    <button type="button" data-go="stats"><span>📊</span>記録</button>
    <button type="button" data-go="settings"><span>⚙️</span>設定</button>
  </nav>

  <dialog id="cropDialog" class="dialog"></dialog>
  <dialog id="zoomDialog" class="dialog zoom"></dialog>
  <dialog id="askDialog" class="dialog small-dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
