<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="robots" content="noindex">
  <title>保護者の画面</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .p-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    .p-tabs button { flex: 1 1 auto; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 10px 8px; font-size: 15px; }
    .p-tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
    .p-count { display: inline-block; min-width: 1.4em; padding: 0 6px; margin-left: 4px; border-radius: 99px; background: var(--ng); color: #fff; font-size: 12px; line-height: 1.5; }
    .p-field { display: block; width: 100%; font-size: 17px; padding: 9px 10px; margin: 4px 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
    .p-list { list-style: none; padding: 0; margin: 6px 0 0; }
    .p-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    .p-list li > .p-main { flex: 1 1 12em; min-width: 0; overflow-wrap: anywhere; }
    .p-stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .p-stamps button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 10px; font-size: 15px; }
    .p-stamps button[aria-pressed="true"] { border: 2px solid var(--accent); font-weight: 700; }
    .p-err { color: var(--ng); }
    .p-num { font-variant-numeric: tabular-nums; }
    .p-row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .p-row-btns .btn { padding: 6px 12px; font-size: 14px; }
    a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="home-btn">👪 保護者の画面</span>
    <span class="top-actions"><a class="icon-btn" href="index.html" aria-label="アプリへ">📚<span>アプリ</span></a></span>
  </header>
  <main id="app" class="container" aria-live="polite"></main>
  <script src="js/util.js"></script>
  <script src="js/sheetsync.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/parent.js"></script>
</body>
</html>
